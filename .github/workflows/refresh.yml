name: Refresh listings

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 Israel summer time, 05:00 winter
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape cinemas and look up ratings
        run: node scripts/actions.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Save debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit data
        run: |
          git config user.name "listings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh listings" && git push)

      - name: Build site folder
        run: mkdir -p _site && cp index.html _site/ && cp -r data _site/ && rm -f _site/data/ratings-cache.json

      # The page is served by Cloudflare Pages at https://tlvf.pages.dev.
      # Does nothing until the two Cloudflare secrets exist.
      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@3 pages project create tlvf --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy _site --project-name=tlvf --branch=main --commit-dirty=true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
