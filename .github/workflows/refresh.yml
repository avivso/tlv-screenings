name: Refresh listings

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 Israel summer time, 05:00 winter
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install headless Chrome
        run: npm install --no-save --no-package-lock puppeteer@23.10.4

      - name: Scrape cinemas and look up ratings
        run: node scrape.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

      - name: Save debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit data
        run: |
          git config user.name "listings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh listings" && git push)

      - name: Build site folder
        run: mkdir -p _site && cp index.html _site/ && cp -r data _site/ && rm -f _site/data/ratings-cache.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
